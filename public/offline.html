<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>S2G — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #111111;
      color: #F5F2EC;
      font-family: "Arial Narrow", Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 2rem 1.5rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      text-align: center;
    }
    .wordmark {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      color: #F5F2EC;
    }
    .tagline {
      margin-top: 0.4rem;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #D9D6CF;
    }
    .divider {
      width: 2rem;
      height: 1px;
      background: rgba(245,242,236,0.2);
      margin: 2.5rem auto;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 1.25rem;
      opacity: 0.5;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F5F2EC;
    }
    p {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #D9D6CF;
      max-width: 22rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      background: #F5F2EC;
      color: #111111;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 2.75rem;
    }
    .retry-btn:hover { background: #D9D6CF; }
    .retry-btn:active { background: #c8c4bc; }
    .note {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: rgba(217,214,207,0.5);
      max-width: 20rem;
    }
  </style>
</head>
<body>
  <div class="wordmark">S2G</div>
  <div class="tagline">Curated thrift</div>
  <div class="divider"></div>
  <div class="icon">✦</div>
  <h1>You're offline</h1>
  <p>Check your internet connection and try again. Previously visited pages may still be available.</p>
  <button class="retry-btn" onclick="retry()">Retry connection</button>
  <p class="note">Live stock, prices and product availability require an internet connection.</p>

  <script>
    function retry() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        window.location.href = '/';
      }
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
